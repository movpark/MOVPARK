
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVPARK - Watch Movies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#111522;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:bold;color:#e50914}
input,select{padding:12px;border:0;border-radius:7px;background:#222839;color:white}
main{padding:20px 5%}
h2{margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:17px}
.movie{background:#171c29;border-radius:9px;overflow:hidden;cursor:pointer}
.movie img{width:100%;aspect-ratio:2/3;object-fit:cover}
.movie p{padding:0 10px;font-size:14px;font-weight:bold}
button{background:#e50914;color:white;border:0;padding:11px 16px;border-radius:6px;cursor:pointer;margin:4px}
button:hover{background:#b20710}
#modal{display:none;position:fixed;inset:0;background:#000e;overflow:auto;padding:20px;z-index:5}
.panel{max-width:750px;margin:20px auto;background:#171c29;padding:20px;border-radius:12px}
#player{width:100%;aspect-ratio:16/9;background:#000;margin-top:15px}
#player iframe{width:100%;height:100%;border:0}
.small{color:#b9c0d0;font-size:13px}
a{color:#ff646b}
</style>
</head>
<body>

<header>
  <div class="logo">MOVPARK</div>
  <input id="search" placeholder="Search movies..." oninput="searchMovies()">
  <select id="language" onchange="loadMovies()">
    <option value="">All Languages</option>
    <option value="ml">Malayalam</option>
    <option value="ta">Tamil</option>
    <option value="te">Telugu</option>
    <option value="hi">Hindi</option>
    <option value="en">English</option>
  </select>
</header>

<main>
  <h2>Trending Movies</h2>
  <div id="movies" class="grid">Loading movies...</div>
  <button onclick="loadMore()">Load More</button>
</main>

<div id="modal">
  <div class="panel">
    <button onclick="closeMovie()">✕ Close</button>
    <div id="details"></div>
    <div id="player"></div>
    <div id="watchOptions"></div>
  </div>
</div>

<script>
const TMDB_API_KEY = "916706f1b6e4d8f8a66934be7d0b6410";

/*
Add only videos you own or have permission to embed.

Example:
"550": {
  youtube: "https://www.youtube.com/watch?v=VIDEO_ID",
  vimeo: "https://vimeo.com/VIDEO_ID",
  mx: "https://www.mxplayer.in/official-movie-page"
}

The number is the TMDB movie ID.
*/
const LEGAL_VIDEOS = {
  // Add authorized movie video links here.
};

const IMAGE = "https://image.tmdb.org/t/p/w500";
let page = 1;
let currentMovies = [];
let selectedMovie = null;

function validKey(){
  return /^[a-f0-9]{32}$/i.test(TMDB_API_KEY);
}

async function api(path){
  if(!validKey()){
    document.getElementById("movies").innerHTML =
      "Please add your TMDB API key in the code first.";
    return null;
  }
  const response = await fetch(
    "https://api.themoviedb.org/3" + path +
    (path.includes("?") ? "&" : "?") +
    "api_key=" + TMDB_API_KEY
  );
  if(!response.ok) throw new Error("TMDB request failed");
  return response.json();
}

async function loadMovies(){
  page = 1;
  const lang = document.getElementById("language").value;
  const path = lang
    ? `/discover/movie?language=en-US&with_original_language=${lang}&sort_by=popularity.desc&page=${page}`
    : `/trending/movie/week?language=en-US&page=${page}`;
  try{
    const data = await api(path);
    if(data) showMovies(data.results, true);
  }catch(e){
    document.getElementById("movies").innerText = "Could not load movies. Check your API key and internet.";
  }
}

function showMovies(list, reset=false){
  if(reset) currentMovies = [];
  currentMovies.push(...(list || []));
  const container = document.getElementById("movies");
  if(reset) container.innerHTML = "";
  (list || []).forEach(movie=>{
    const card = document.createElement("div");
    card.className = "movie";
    const poster = movie.poster_path
      ? IMAGE + movie.poster_path
      : "https://placehold.co/300x450?text=No+Poster";
    card.innerHTML = `
      <img src="${poster}" alt="">
      <p>${escapeHTML(movie.title || "Untitled")}</p>`;
    card.onclick = ()=>openMovie(movie.id);
    container.appendChild(card);
  });
}

async function loadMore(){
  page++;
  const lang = document.getElementById("language").value;
  const path = lang
    ? `/discover/movie?language=en-US&with_original_language=${lang}&sort_by=popularity.desc&page=${page}`
    : `/trending/movie/week?language=en-US&page=${page}`;
  try{
    const data = await api(path);
    if(data) showMovies(data.results);
  }catch(e){}
}

let searchTimer;
function searchMovies(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async ()=>{
    const q = document.getElementById("search").value.trim();
    if(!q){loadMovies();return;}
    try{
      const data = await api(`/search/movie?query=${encodeURIComponent(q)}&page=1`);
      if(data) showMovies(data.results, true);
    }catch(e){}
  },400);
}

async function openMovie(id){
  try{
    const movie = await api(`/movie/${id}?language=en-US`);
    if(!movie) return;
    selectedMovie = movie;
    document.getElementById("modal").style.display = "block";
    document.getElementById("details").innerHTML = `
      <h2>${escapeHTML(movie.title || "")}</h2>
      <p class="small">${movie.release_date || ""} | ${movie.runtime || "?"} min</p>
      <p>${escapeHTML(movie.overview || "No description available.")}</p>
    `;
    document.getElementById("player").innerHTML =
      "<p class='small' style='padding:15px'>Choose an available legal video source below.</p>";
    showWatchOptions(movie);
  }catch(e){
    alert("Could not load movie details.");
  }
}

function showWatchOptions(movie){
  const links = LEGAL_VIDEOS[movie.id] || {};
  let html = "<h3>Watch Options</h3>";

  if(links.youtube){
    html += `<button onclick="playVideo('youtube')">Play on YouTube</button>`;
  }
  if(links.vimeo){
    html += `<button onclick="playVideo('vimeo')">Play on Vimeo</button>`;
  }
  if(links.mx){
    html += `<button onclick="openExternal('mx')">Open MX Player</button>`;
  }

  html += `<button onclick="showTrailer()">Watch Official Trailer</button>`;
  html += `<button onclick="showProviders()">OTT Availability</button>`;
  html += `<p class="small">Only videos authorized for embedding are played here. Other official services open on their own websites.</p>`;

  document.getElementById("watchOptions").innerHTML = html;
}

function getYouTubeId(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    if(u.hostname.includes("youtube.com")) return u.searchParams.get("v");
  }catch(e){}
  return null;
}

function playVideo(source){
  const links = LEGAL_VIDEOS[selectedMovie.id] || {};
  let url = links[source];
  if(!url) return;

  let embed = "";
  if(source === "youtube"){
    const id = getYouTubeId(url);
    if(id) embed = "https://www.youtube.com/embed/" + encodeURIComponent(id);
  }
  if(source === "vimeo"){
    const match = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(match) embed = "https://player.vimeo.com/video/" + match[1];
  }

  if(embed){
    document.getElementById("player").innerHTML =
      `<iframe src="${embed}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
  }else{
    alert("This video link cannot be embedded. Please check the official link.");
  }
}

function openExternal(source){
  const links = LEGAL_VIDEOS[selectedMovie.id] || {};
  if(links[source]) window.open(links[source], "_blank", "noopener");
}

async function showTrailer(){
  try{
    const data = await api(`/movie/${selectedMovie.id}/videos?language=en-US`);
    const trailer = data.results.find(v =>
      v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")
    );
    if(!trailer){
      alert("No official trailer found.");
      return;
    }
    document.getElementById("player").innerHTML =
      `<iframe src="https://www.youtube.com/embed/${trailer.key}" allowfullscreen></iframe>`;
  }catch(e){
    alert("Trailer could not be loaded.");
  }
}

async function showProviders(){
  try{
    const data = await api(`/movie/${selectedMovie.id}/watch/providers`);
    const india = data.results && data.results.IN;
    if(!india){
      alert("OTT provider information is not available for India.");
      return;
    }
    let html = "<h3>Available OTT Platforms in India</h3>";
    ["flatrate","rent","buy"].forEach(type=>{
      (india[type] || []).forEach(provider=>{
        html += `<p>${escapeHTML(provider.provider_name)} - ${type}</p>`;
      });
    });
    if(india.link){
      html += `<p><a href="${india.link}" target="_blank" rel="noopener">View official watch options</a></p>`;
    }
    document.getElementById("watchOptions").innerHTML = html;
  }catch(e){
    alert("OTT information could not be loaded.");
  }
}

function closeMovie(){
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").innerHTML = "";
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

loadMovies();
</script>
</body>
</html>
