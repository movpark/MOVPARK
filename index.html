
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVPARK - Watch Movies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#101522;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;color:#f5bd35}
header span{color:#aaa;font-size:12px}
main{padding:25px 5%}
.hero{padding:45px 25px;border-radius:18px;background:linear-gradient(120deg,#222b43,#111827);margin-bottom:30px}
.hero h1{font-size:35px;margin:0 0 10px}
.hero p{color:#bbb}
input,select{padding:13px;border:1px solid #30394b;border-radius:9px;background:#151c2a;color:white;width:100%;margin:8px 0}
.controls{display:grid;grid-template-columns:2fr 1fr;gap:10px}
h2{margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:17px}
.card{background:#131a27;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}
.card h3{font-size:14px;margin:10px}
.card p{font-size:12px;color:#aaa;margin:0 10px 12px}
button{border:0;padding:11px 17px;border-radius:8px;background:#f5bd35;color:#111;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#263248;color:#fff}
#status{color:#f5bd35;margin:15px 0}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;overflow:auto;padding:20px}
.dialog{max-width:750px;margin:30px auto;background:#111927;padding:22px;border-radius:15px}
.close{float:right;background:#333;color:#fff}
#player{width:100%;max-height:430px;background:#000;margin-top:15px}
#message{color:#f5bd35;line-height:1.6}
small{color:#999}
footer{text-align:center;color:#777;padding:30px;font-size:12px}
a{color:#f5bd35}
@media(max-width:550px){.hero h1{font-size:27px}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="logo">MOVPARK</div>
  <span>DISCOVER MOVIES</span>
</header>

<main>
  <section class="hero">
    <h1>Discover Movies.</h1>
    <p>Explore movies and find legally shareable films.</p>
    <div class="controls">
      <input id="search" placeholder="Search movies..." />
      <select id="language">
        <option value="all">All Languages</option>
        <option value="ml">Malayalam</option>
        <option value="ta">Tamil</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
      </select>
    </div>
    <button onclick="searchMovies()">Search</button>
  </section>

  <div id="status">Loading movies...</div>

  <h2>Trending Movies</h2>
  <div class="grid" id="trending"></div>

  <h2>Explore Movies</h2>
  <div class="grid" id="movies"></div>
  <button class="secondary" id="more" onclick="loadMore()">Load More</button>
</main>

<div class="modal" id="modal">
  <div class="dialog">
    <button class="close" onclick="closeModal()">Close ✕</button>
    <div id="details"></div>
    <p id="message"></p>
    <video id="player" controls playsinline style="display:none"></video>
  </div>
</div>

<footer>
  MOVPARK is an independent movie discovery project.
  Movie information provided by TMDB.
  MOVPARK is not endorsed or certified by TMDB.
</footer>

<script>
// ======================================
// PASTE YOUR TMDB API KEY ONLY HERE
// ======================================
const TMDB_API_KEY = "916706f1b6e4d8f8a66934be7d0b6410";

// ======================================

const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";
let page = 1;
let currentQuery = "";
let selectedLanguage = "all";
let busy = false;

const $ = id => document.getElementById(id);

function validKey(){
  return /^[a-f0-9]{32}$/i.test(TMDB_API_KEY);
}

async function tmdb(path){
  if(!validKey()){
    throw new Error("Please add your TMDB API key at the top of the code.");
  }
  const separator = path.includes("?") ? "&" : "?";
  const response = await fetch(
    API + path + separator + "api_key=" + encodeURIComponent(TMDB_API_KEY)
  );
  if(!response.ok) throw new Error("TMDB error: " + response.status);
  return response.json();
}

function imageUrl(path){
  return path ? IMG + path : "";
}

function makeCard(movie){
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = imageUrl(movie.poster_path);
  img.alt = movie.title || "Movie poster";
  img.loading = "lazy";

  const title = document.createElement("h3");
  title.textContent = movie.title || "Untitled";

  const year = document.createElement("p");
  year.textContent = (movie.release_date || "").slice(0,4)
    + " • " + (movie.original_language || "").toUpperCase();

  card.append(img,title,year);
  card.onclick = () => showDetails(movie);
  return card;
}

function render(list, container){
  container.innerHTML = "";
  list.forEach(movie => container.appendChild(makeCard(movie)));
}

function languageFilter(list){
  if(selectedLanguage === "all") return list;
  return list.filter(movie => movie.original_language === selectedLanguage);
}

async function loadTrending(){
  try{
    const data = await tmdb("/trending/movie/week?language=en-US");
    render(languageFilter(data.results || []), $("trending"));
  }catch(error){
    $("status").textContent = error.message;
  }
}

async function loadMovies(reset = false){
  if(busy) return;
  busy = true;
  $("more").disabled = true;

  if(reset){
    page = 1;
    $("movies").innerHTML = "";
  }

  try{
    let path;

    if(currentQuery){
      path = "/search/movie?query=" + encodeURIComponent(currentQuery)
        + "&include_adult=false&page=" + page + "&language=en-US";
    }else{
      path = "/discover/movie?include_adult=false&sort_by=popularity.desc"
        + "&page=" + page + "&language=en-US";

      if(selectedLanguage !== "all"){
        path += "&with_original_language=" + selectedLanguage;
      }
    }

    const data = await tmdb(path);
    let results = data.results || [];

    if(currentQuery && selectedLanguage !== "all"){
      results = results.filter(movie =>
        movie.original_language === selectedLanguage
      );
    }

    results.forEach(movie => {
      $("movies").appendChild(makeCard(movie));
    });

    $("status").textContent = results.length
      ? "Movies loaded."
      : "No matching movies found.";

    $("more").style.display = page < (data.total_pages || 1)
      ? "inline-block" : "none";

  }catch(error){
    $("status").textContent = error.message;
  }finally{
    busy = false;
    $("more").disabled = false;
  }
}

function searchMovies(){
  currentQuery = $("search").value.trim();
  selectedLanguage = $("language").value;
  loadMovies(true);
}

function loadMore(){
  page++;
  loadMovies(false);
}

$("language").addEventListener("change", searchMovies);
$("search").addEventListener("keydown", e => {
  if(e.key === "Enter") searchMovies();
});

// ======================================
// INTERNET ARCHIVE VIDEO SEARCH
// ======================================

// Accept only recognized, shareable licence types.
// Non-commercial licences are deliberately excluded.

function allowedLicense(metadata){
  const m = metadata.metadata || {};

  const values = [
    m.licenseurl,
    m.license,
    m.rights
  ].flat().filter(Boolean).join(" ").toLowerCase();

  if(values.includes("public domain")) return true;
  if(values.includes("creativecommons.org/publicdomain/")) return true;
  if(values.includes("creativecommons.org/licenses/cc0/")) return true;

  const hasCC = values.includes("creativecommons.org/licenses/");
  const allowedCC = /creativecommons\.org\/licenses\/by(-sa|-nd)?\/(2\.0|2\.5|3\.0|4\.0)/i;

  return hasCC && allowedCC.test(values);
}

function cleanTitle(value){
  return (value || "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    .trim();
}

function matchingTitle(a,b){
  const x = cleanTitle(a);
  const y = cleanTitle(b);
  return x && y && x === y;
}

function encodeFilePath(path){
  return path.split("/").map(part => encodeURIComponent(part)).join("/");
}

async function findLegalVideo(movie){
  $("message").textContent =
    "Searching for a matching movie with a recognized licence...";

  const query = 'title:"' + movie.title.replace(/["\\]/g,"") +
    '" AND mediatype:movies';

  const searchURL =
    "https://archive.org/advancedsearch.php?q=" +
    encodeURIComponent(query) +
    "&fl[]=identifier,title&rows=10&page=1&output=json";

  const response = await fetch(searchURL);
  if(!response.ok) throw new Error("Archive search failed.");

  const searchData = await response.json();
  const docs = searchData.response?.docs || [];

  for(const item of docs){
    if(!matchingTitle(item.title,movie.title)) continue;

    const metadataResponse = await fetch(
      "https://archive.org/metadata/" +
      encodeURIComponent(item.identifier)
    );

    if(!metadataResponse.ok) continue;

    const metadata = await metadataResponse.json();

    if(!allowedLicense(metadata)) continue;

    const files = metadata.files || [];

    const videoFile = files.find(file => {
      const name = (file.name || "").toLowerCase();
      const format = (file.format || "").toLowerCase();

      return name.endsWith(".mp4") ||
        format === "mpeg4";
    });

    if(!videoFile) continue;

    if(videoFile.size && Number(videoFile.size) < 100000) continue;

    const url = "https://archive.org/download/" +
      encodeURIComponent(item.identifier) + "/" +
      encodeFilePath(videoFile.name);

    return {
      url,
      identifier: item.identifier,
      title: item.title,
      license: metadata.metadata.licenseurl ||
        metadata.metadata.license ||
        metadata.metadata.rights ||
        "Public Domain",
      source: "Internet Archive"
    };
  }

  return null;
}

// ======================================
// MOVIE DETAILS AND PLAYER
// ======================================

let activeVideo = null;

async function showDetails(movie){
  closeModal();

  $("modal").style.display = "block";
  $("player").style.display = "none";
  $("message").textContent = "";

  $("details").innerHTML = "";

  const title = document.createElement("h2");
  title.textContent = movie.title || "Movie";

  const overview = document.createElement("p");
  overview.textContent = movie.overview || "No description available.";

  const info = document.createElement("p");
  info.textContent =
    "Release: " + (movie.release_date || "Unknown") +
    " | Language: " + (movie.original_language || "Unknown");

  const button = document.createElement("button");
  button.textContent = "Find Legal Video & Play";
  button.onclick = () => findAndPlay(movie, button);

  $("details").append(title,overview,info,button);
}

async function findAndPlay(movie, button){
  button.disabled = true;
  button.textContent = "Checking video...";

  $("player").pause();
  $("player").removeAttribute("src");
  $("player").load();
  $("player").style.display = "none";

  try{
    const video = await findLegalVideo(movie);

    if(!video){
      $("message").textContent =
        "No matching video with a recognized licence and MP4 file was found. This movie will not be shown as playable.";
      return;
    }

    activeVideo = video;

    const player = $("player");
    player.src = video.url;
    player.style.display = "block";

    $("message").textContent =
      "Checking whether this video can play...";

    player.oncanplay = () => {
      $("message").innerHTML =
        "Video ready. Source: Internet Archive. " +
        "Licence: " + escapeHTML(String(video.license)) +
        ' <br><a href="https://archive.org/details/' +
        encodeURIComponent(video.identifier) +
        '" target="_blank" rel="noopener">View original item and licence</a>';
    };

    player.onerror = () => {
      player.style.display = "none";
      player.removeAttribute("src");
      $("message").textContent =
        "This video could not be played. It has been hidden.";
    };

    await player.play();

  }catch(error){
    $("message").textContent =
      "Unable to check this video: " + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "Find Legal Video & Play";
  }
}

function escapeHTML(value){
  return value.replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function closeModal(){
  $("player").pause();
  $("player").removeAttribute("src");
  $("player").load();
  $("player").style.display = "none";
  $("modal").style.display = "none";
  activeVideo = null;
}

$("modal").addEventListener("click", e => {
  if(e.target === $("modal")) closeModal();
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
});

// ======================================
// START WEBSITE
// ======================================

async function start(){
  if(!validKey()){
    $("status").textContent =
      "Add your TMDB API key at the top of this file to load movies.";
    return;
  }

  await Promise.all([
    loadTrending(),
    loadMovies(true)
  ]);
}

start();
</script>
</body>
</html>
